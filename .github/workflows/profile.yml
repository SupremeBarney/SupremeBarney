name: Update profile
on:
  # Tous les jours à 0h (UTC)
  schedule:
    - cron: "0 0 * * *"
  # Lancement manuel depuis l'onglet Actions
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Metrics
        uses: lowlighter/metrics@latest
        with:
          filename: output/metrics.svg
          # Pour inclure les dépôts privés : créer le secret PERSONAL_ACCESS_TOKEN
          # et remplacer par ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: X

  contrib-3d:
    # Après metrics, pour éviter que les deux push se marchent dessus
    needs: metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: update 3D contribution graph"
          git pull --rebase
          git push
